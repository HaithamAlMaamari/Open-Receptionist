[project]
name = "open-receptionist"
version = "0.1.0.dev0"
description = "Open-source bilingual (Arabic + English) AI phone receptionist + chatbot for small businesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Haitham Al Maamari" }]
dependencies = [
    # runner extra = FastAPI dev runner (python -m agent.bot). >=1.7 is the
    # version CI verified our import surface against; <2.0 because 2.0
    # removes deprecated APIs. Pin exactly after first light.
    "pipecat-ai[webrtc,silero,deepgram,anthropic,elevenlabs,runner]>=1.7,<2.0",
    # Transitive via pipecat (TTS sentence tokenization). nltk 3.10.1 added an
    # import hook that blocks any module resolving inside the process CWD — with
    # the README's `.venv` inside the repo, that is all of site-packages, so
    # `import pipecat.utils.string` dies before the bot starts. CI never saw it
    # (system Python puts site-packages outside the CWD). Drop this pin once a
    # fixed nltk ships; the `!=` lets 3.10.2+ in automatically.
    "nltk!=3.10.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/HaithamAlMaamari/Open-Receptionist"
Issues = "https://github.com/HaithamAlMaamari/Open-Receptionist/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.providers", "agent.tools", "agent.transports"]

[tool.setuptools.package-data]
agent = ["prompts/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
